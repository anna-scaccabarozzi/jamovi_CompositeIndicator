title: Maps
name: maps
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Statistical unit column (region/country)
        children:
          - type: VariablesListBox
            name: stat_unit
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Indicators for maps
        children:
          - type: VariablesListBox
            name: map_fill_variables
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: latitude_min
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: latitude_max
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: longitude_min
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: longitude_max
        format: number
